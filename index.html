<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocLib v1.29</title><script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script><style>:root{--bg:#f4f5f7;--line:#d8dde6;--blue:#1769e0;--ink:#172033;--muted:#667085;--sel:#e8f1ff}*{box-sizing:border-box}body{font:14px Arial;margin:0;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}.top{height:80px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:16px}.logo{font-size:20px;font-weight:700}.title b{color:#075ac8;font-size:18px}.title small{display:block;color:var(--muted)}.status{margin-left:auto}.toolbar{height:64px;margin:12px;background:#fff;border-radius:8px;padding:12px;display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:5px;padding:9px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.search{padding:9px 11px;border:1px solid var(--line);border-radius:5px;margin-left:auto;min-width:280px}.workspace{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;margin:0 12px 12px;height:calc(100vh - 168px)}.panel{background:#fff;border-radius:8px;overflow:hidden}.tree-head,.table-head{height:48px;padding:13px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between}.tree{height:calc(100% - 48px);overflow:auto;padding:8px}.node{user-select:none}.node-row{display:flex;align-items:center;gap:6px;padding:6px;border-radius:5px;cursor:pointer;white-space:nowrap}.node-row:hover{background:#f2f4f7}.node-row.active{background:var(--sel);color:#075ac8}.twisty{width:16px;text-align:center;color:#667085}.folder-icon{width:18px}.children{margin-left:19px}.count{color:#667085;font-size:12px}.table-wrap{height:calc(100% - 48px);overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #e4e7ec;font-size:13px}th{background:#eef1f5;position:sticky;top:0;z-index:2}tr.selected{background:var(--sel)}.file-cell{display:flex;align-items:center;gap:9px}.diag{display:none;position:fixed;inset:120px 40px 40px;background:#101828;color:#d1fadf;border-radius:8px;padding:14px;z-index:10;overflow:auto}.diag pre{white-space:pre-wrap;font:11px monospace}.ok{color:#087a55}.bad{color:#b42318}@media(max-width:900px){.workspace{grid-template-columns:260px minmax(600px,1fr)}.search{min-width:190px}}.dropdown{position:relative}.format-menu{display:none;position:absolute;top:40px;left:0;z-index:20;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(16,24,40,.18);border-radius:7px;padding:10px;min-width:210px;max-height:310px;overflow:auto}.format-menu.open{display:block}.format-option{display:flex;gap:8px;padding:5px}.format{font-size:11px;background:#eef2f6;border-radius:4px;padding:2px 5px}</style></head><body><header class="top"><div class="logo">Norconsult</div><div class="title"><b>DocLib v1.29</b><strong> VIEWER_MODEL_CONTROL</strong><small>Mappevalg + filformat + modellstyring i 3D-vieweren</small></div><div id="status" class="status">Venter...</div></header><section class="toolbar"><button id="refresh" class="btn primary">Oppdater metadata</button><button id="diagToggle" class="btn">Diagnostikk</button><button id="clearSelection" class="btn">Tøm modellvalg</button><button id="clearFolders" class="btn">Vis alle mapper</button><button id="showSelected" class="btn primary">Vis valgte i 3D</button><button id="hideSelected" class="btn">Skjul valgte</button><button id="onlySelected" class="btn">Vis kun valgte</button><button id="removeSelected" class="btn">Fjern fra 3D</button><div class="dropdown"><button id="formatButton" class="btn">Filformater: alle</button><div id="formatMenu" class="format-menu"></div></div><strong id="selectionCount">0 modeller valgt</strong><span id="progress"></span><input id="search" class="search" placeho
