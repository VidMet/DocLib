<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DocLib v1.25</title><script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script><style>
:root{--bg:#f3f4f6;--border:#d1d5db;--ink:#111827;--muted:#6b7280;--blue:#1d4ed8;--ok:#22a06b;--warn:#f79009;--bad:#d92d20}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}.topbar{height:92px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:10px 18px}.logo-card{width:145px;height:68px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center}.logo-card img{max-width:128px;max-height:50px}.app-title{display:flex;flex-direction:column}.app-title b{font-size:18px;color:#0050b5}.app-title span{font-size:14px;font-weight:600}.app-title em{font-size:12px;color:var(--muted)}.header-right{margin-left:auto}.status{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#98a2b3}.dot.live{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.error{background:var(--bad)}.main-content{padding:20px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;background:#fff;padding:15px 20px;border-radius:6px;flex-wrap:wrap;gap:10px}.search-container{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.search-bar{padding:8px 12px;border:1px solid var(--border);border-radius:4px}.search-input{width:300px}.folder-select{width:220px;display:none}.btn{padding:8px 16px;border:0;border-radius:4px;font-weight:600;cursor:pointer}.btn-primary{background:var(--blue);color:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px 15px;text-align:left;font-size:13px;border-bottom:1px solid #dee2e6}th{background:#f1f3f5}.loading{text-align:center;padding:40px;color:var(--muted)}.progress-text{font-size:12px;color:var(--muted);margin-left:10px}.diag{display:none;margin-top:14px;background:#111827;color:#d1fae5;border-radius:6px;padding:12px}.diag pre{white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;font-size:11px}
</style></head><body><header class="topbar"><div class="logo-card"><img src="norconsult-logo-black.png" alt="Norconsult" onerror="this.style.display='none'"></div><div class="app-title"><b>DocLib v1.25</b><span>Norconsult Norge</span><em>TARGETED_PROPERTY_QUERY</em></div><div class="header-right"><div class="status"><span id="statusText">Venter på API...</span><span id="statusDot" class="dot"></span></div></div></header><div class="main-content"><div class="toolbar"><div style="display:flex;align-items:center"><h3>Filer og egenskaper</h3><span id="progressIndicator" class="progress-text"></span></div><div class="search-container"><button class="btn btn-primary" id="refreshBtn">Oppdater metadata</button><button class="btn" id="diagBtn">Vis/skjul diagnostikk</button><select id="folderSelect" class="search-bar folder-select"><option value="all">Alle mapper</option></select><input id="searchInput" class="search-bar search-input" placeholder="Søk i modeller eller metadata..."></div></div><table><thead><tr><th>Filnavn</th><th>Mappe</th><th>Fag</th><th>MMI</th><th>Revisjon</th><th>Revisjonsdato</th><th>Revisjonen gjelder</th></tr></thead><tbody id="tableBody"><tr><td colspan="7" class="loading">Data lastes inn.</td></tr></tbody></table><section id="diagPanel" class="diag"><div style="display:flex;justify-content:space-between"><strong>DocLib v1.25 diagnostikk</strong><button class="btn" id="clearDiagBtn">Tøm logg</button></div><pre id="diagOutput"></pre></section></div><script src="app.js?v=1.25"></script></body></html>
