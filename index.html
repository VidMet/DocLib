<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocLib v1.23.1</title>
  <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');
    :root{--bg:#f3f4f6;--surface:#fff;--border:#d1d5db;--ink:#111827;--muted:#6b7280;--blue:#1d4ed8;--ok:#22a06b;--warn:#f79009;--bad:#d92d20;--sans:'Syne',sans-serif}
    *{box-sizing:border-box} body{font-family:var(--sans),Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
    .topbar{height:92px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:10px 18px;flex:0 0 auto}
    .logo-card{width:145px;height:68px;border:1px solid var(--border);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(16,24,40,.08);overflow:hidden;flex-shrink:0}.logo-card img{max-width:128px;max-height:50px;object-fit:contain}
    .app-title{display:flex;flex-direction:column;line-height:1.2}.app-title b{font-size:18px;color:#0050b5}.app-title span{font-size:14px;font-weight:600}.app-title em{font-size:12px;color:var(--muted);font-style:normal}.header-right{margin-left:auto}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}.dot{width:9px;height:9px;border-radius:50%;background:#98a2b3}.dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.warn{background:var(--warn)}.dot.error{background:var(--bad)}
    .main-content{padding:20px;flex:1 1 auto;overflow-y:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;background:#fff;padding:15px 20px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.1);flex-wrap:wrap;gap:10px}.toolbar h3{margin:0;font-size:1rem}.toolbar-left{display:flex;align-items:center}.search-container{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.search-bar{padding:8px 12px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-family:var(--sans)}.search-input{width:300px}.folder-select{width:220px;cursor:pointer;display:none}.btn{padding:8px 16px;border-radius:4px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;border:none}.btn:hover{opacity:.8}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#e5e7eb;color:#111827}
    table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);border-radius:6px;overflow:hidden}th,td{padding:12px 15px;text-align:left;font-size:13px;border-bottom:1px solid #dee2e6}th{background:#f1f3f5;color:#495057;font-weight:600}tr:hover{background:#f8f9fa}.loading{text-align:center;padding:40px;font-style:italic;color:var(--muted)}.progress-text{font-size:12px;color:var(--muted);margin-left:10px}
    .diag{margin-top:14px;background:#111827;color:#d1fae5;border-radius:6px;padding:12px;display:none}.diag-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.diag h4{margin:0;color:#fff}.diag pre{margin:10px 0 0;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.45}
  </style>
</head>
<body>
<header class="topbar">
  <div class="logo-card"><img src="norconsult-logo-black.png" alt="Norconsult" onerror="this.style.display='none'"></div>
  <div class="app-title"><b>DocLib v1.23.1</b><span>Norconsult Norge</span><em>MODEL_API_DIAGNOSTICS</em></div>
  <div class="header-right"><div class="status"><span id="statusText">Venter på API...</span><span id="statusDot" class="dot"></span></div></div>
</header>
<div class="main-content">
  <div class="toolbar">
    <div class="toolbar-left"><h3>Filer og egenskaper</h3><span id="progressIndicator" class="progress-text"></span></div>
    <div class="search-container">
      <button class="btn btn-primary" id="refreshBtn">Last inn prosjekt</button>
      <button class="btn btn-secondary" id="diagBtn">Vis/skjul diagnostikk</button>
      <div style="width:1px;height:24px;background:var(--border);margin:0 8px"></div>
      <select id="folderSelect" class="search-bar folder-select"><option value="all">Alle mapper</option></select>
      <input type="text" id="searchInput" class="search-bar search-input" placeholder="Søk i modeller eller metadata...">
    </div>
  </div>
  <table id="metadataTable"><thead><tr><th>Filnavn</th><th>Mappe</th><th>Fag</th><th>MMI</th><th>Revisjon</th><th>Revisjonsdato</th><th>Revisjonen gjelder</th></tr></thead><tbody id="tableBody"><tr><td colspan="7" class="loading">Data lastes inn. Se status øverst til høyre.</td></tr></tbody></table>
  <section id="diagPanel" class="diag"><div class="diag-head"><h4>DocLib v1.23.1 Model API-diagnostikk</h4><button class="btn btn-secondary" id="clearDiagBtn">Tøm logg</button></div><pre id="diagOutput"></pre></section>
</div>
<script src="app.js?v=1.23.1"></script>
</body>
</html>
